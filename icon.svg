<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ساعة الدواء">
  <!-- Background (maskable-safe: content stays within inner 80% circle) -->
  <rect width="512" height="512" rx="96" fill="#070a14"/>

  <!-- Outer clock ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#4f8cff" stroke-width="22"/>

  <!-- 12 hour ticks -->
  <g stroke="#f0f4ff" stroke-width="14" stroke-linecap="round">
    <!-- 12 -->
    <line x1="256" y1="106" x2="256" y2="140"/>
    <!-- 3 -->
    <line x1="406" y1="256" x2="372" y2="256"/>
    <!-- 6 -->
    <line x1="256" y1="406" x2="256" y2="372"/>
    <!-- 9 -->
    <line x1="106" y1="256" x2="140" y2="256"/>
  </g>

  <!-- Hour hand (pointing ~10 o'clock) -->
  <line x1="256" y1="256" x2="196" y2="196"
        stroke="#f0f4ff" stroke-width="20" stroke-linecap="round"/>

  <!-- Minute hand (pointing ~2 o'clock) -->
  <line x1="256" y1="256" x2="336" y2="196"
        stroke="#4f8cff" stroke-width="16" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="14" fill="#4f8cff"/>

  <!-- Small pill badge (bottom-right of the clock face) -->
  <g transform="translate(340 340) rotate(-45)">
    <rect x="-42" y="-20" width="84" height="40" rx="20"
          fill="#ffffff" stroke="#070a14" stroke-width="6"/>
    <line x1="0" y1="-20" x2="0" y2="20"
          stroke="#070a14" stroke-width="6"/>
  </g>
</svg>